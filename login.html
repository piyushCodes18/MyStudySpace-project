<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyStudySpace | Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Quicksand:wght@500;700&display=swap" rel="stylesheet" />
  <style>

    * { box-sizing: border-box; }
    
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #a2c2e4, #fce3d3);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      animation: fadeIn 0.8s ease-in-out;
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .login-container {
      background: #fffaf8;
      border-radius: 20px;
      padding: 15px 25px 25px 25px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
      width: 350px;
      text-align: center;
      transition: transform 0.3s ease;
    }

    .login-container:hover { transform: translateY(-4px); }
    h1 {
      font-family: 'Quicksand', sans-serif;
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 24px;
      color: #2f3a4c;
    }
    label {
      font-weight: 600;
      display: block;
      text-align: left;
      margin-bottom: 5px;
      color: #2f3a4c;
	    font-size:14px;
    }
    input {
      width: 100%;
      padding: 10px;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 12px;
    }
    button {
      width: 100%;
      background-color: #6a8caf;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      font-size: 15px;
      transition: background 0.3s ease;
    }
    button:hover { background-color: #547899; }
    .toggle {
      font-size: 13px;
      margin-top: 10px;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h1>Welcome to MyStudySpace</h1>
    <form onsubmit="handleSubmit(event)">
      <label for="name">Username</label>
      <input type="text" id="name" placeholder="Enter your username" required />
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="Enter your email" required />
      <label for="email">Password</label>
      <input type="password" id="pswd" placeholder="Enter your password" required />
      <button type="submit">Login / Sign Up</button>
    </form>
    <p class="toggle">Your personal study space.</p>
  </div>
  <script>
    function handleSubmit(e){
      e.preventDefault();
      localStorage.setItem('username', document.getElementById('name').value);
      localStorage.setItem('email', document.getElementById('email').value);
	  localStorage.setItem('password', document.getElementById('pswd').value);
      window.location.href = 'main.html';
    }
  </script>
</body>
</html>
